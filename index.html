<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Français avec Dino</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5ff;
      color: #2d2342;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .dino {
      font-size: 80px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .start-button {
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 15px;
      cursor: pointer;
      background: #6c4ab6;
      color: white;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
    }

    .card-icon {
      font-size: 35px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="dino">🦖</div>

    <h1>Français avec Dino</h1>

    <p class="subtitle">
      یادگیری زبان فرانسه، قدم به قدم 🇫🇷
    </p>

    <button class="start-button">
      🚀 شروع یادگیری
    </button>

    <div class="features">

      <div class="card">
        <div class="card-icon">📚</div>
        <h3>لغات</h3>
        <p>لغات جدید یاد بگیر و مرور کن</p>
      </div>

      <div class="card">
        <div class="card-icon">✍️</div>
        <h3>گرامر</h3>
        <p>گرامر فرانسه را مرحله‌به‌مرحله یاد بگیر</p>
      </div>

      <div class="card">
        <div class="card-icon">🔄</div>
        <h3>Conjugaison</h3>
        <p>صرف فعل‌های فرانسوی را تمرین کن</p>
      </div>

      <div class="card">
        <div class="card-icon">🎧</div>
        <h3>Listening</h3>
        <p>مهارت شنیداری‌ات را تقویت کن</p>
      </div>

    </div>

  </div>

</body>
</html>
